name: Project 04 Python tests

on:
  push:
    paths:
      - "04-library-management/**"
      - ".github/workflows/project04-tests.yml"
  pull_request:
    paths:
      - "04-library-management/**"
      - ".github/workflows/project04-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-library-management
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python files
        run: python -m py_compile library_management.py tests/test_library.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
