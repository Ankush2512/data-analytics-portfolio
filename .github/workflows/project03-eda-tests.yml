name: Project 03 Python EDA tests

on:
  push:
    paths:
      - "03-python-eda/**"
      - "requirements.txt"
      - ".github/workflows/project03-eda-tests.yml"
  pull_request:
    paths:
      - "03-python-eda/**"
      - "requirements.txt"
      - ".github/workflows/project03-eda-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run EDA tests
        run: python -m unittest discover -s 03-python-eda/tests -v
      - name: Upload generated EDA outputs
        uses: actions/upload-artifact@v4
        with:
          name: project03-python-eda-outputs
          path: 03-python-eda/output/
          if-no-files-found: error
