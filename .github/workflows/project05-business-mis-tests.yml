name: Project 05 Business Operations MIS tests

on:
  push:
    paths:
      - "05-business-operations-mis/**"
      - "requirements.txt"
      - ".github/workflows/project05-business-mis-tests.yml"
  pull_request:
    paths:
      - "05-business-operations-mis/**"
      - "requirements.txt"
      - ".github/workflows/project05-business-mis-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run MIS tests
        run: python -m unittest discover -s 05-business-operations-mis/tests -v
      - name: Upload generated MIS outputs
        uses: actions/upload-artifact@v4
        with:
          name: project05-business-operations-mis-outputs
          path: 05-business-operations-mis/outputs/
          if-no-files-found: error
